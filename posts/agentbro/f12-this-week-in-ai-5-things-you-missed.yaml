# F12 sample · SAMPLE COPY: replace numbers, names and images before posting.
brand: agentbro
format: F12
title: This Week in AI. 5 Things You Missed
caption: |
  The 5 AI updates that actually matter this week. Sources in the comments.
  Follow for the weekly drop.
slides:
  - layout: cover
    style: banner
    kicker: This week in AI
    tool: openai
    headline: 5 drops
    tagline: you missed

  - layout: news
    masthead: This week in AI
    date: "[Date]"
    headline: The *TL;DR*
    tldr:
      - "[Company] launched [product]: [one-line what it does]"
      - "[Tool] is now free for [who]"
      - "[Model] beats [model] at [task]"

  - layout: news
    masthead: 01 · Launch
    date: "[Date]"
    breaking: true
    source: claude
    headline: "[Company] just launched *[X]*"
    body: "[What it does in one sentence. Who it's for.]"
    visual:
      image: null
      frame: browser
      url: "[source-url]"
      hint: Drop the official screenshot

  - layout: news
    masthead: 02 · Now free
    date: "[Date]"
    source: googlegemini
    headline: "[Paid thing] is now *free*"
    body: "[Who gets it, what the limits are.]"
    visual:
      image: null
      frame: browser
      hint: Drop the announcement screenshot

  - layout: news
    masthead: 03 · Benchmark
    date: "[Date]"
    headline: "[Model] beats [model] at *[task]*"
    visual:
      table:
        cols: ["Model", "Score"]
        rows: [["[Model A]", "[xx]%"], ["[Model B]", "[xx]%"]]
        highlight: 1

  - layout: statement
    kicker: What it means for you
    headline: "*[One sentence]* you can act on today."
    visual:
      checklist: ["[Action 1]", "[Action 2]", "[Action 3]"]

  - layout: cta
    style: question
    kicker: Every week
    headline: Which one are you trying *first?*
    answers: ["01", "02", "03"]
    follow: for the weekly drop
