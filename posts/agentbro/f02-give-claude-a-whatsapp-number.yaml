# F02 Step-by-Step Build · Agent Bro · Day 1 Post 2
# SAMPLE COPY: check every step against the real setup before posting.
brand: agentbro
format: F02
title: Give Claude a WhatsApp Number. Yes, Seriously.
caption: |
  Claude can now answer your WhatsApp. FAQs, leads, bookings. Here's the whole setup.
  Comment WORKFLOW and I'll send you the step-by-step guide.
slides:
  - layout: cover
    style: person
    kicker: Yes, seriously.
    headline: Give *Claude* a WhatsApp number
    tagline: Setup in 20 minutes
    # Drop your cut-out photo here (PNG, no background)
    logos: [claude, whatsapp, n8n]
    note: it replies while you sleep

  - layout: statement
    kicker: What you're building
    headline: What if your WhatsApp could *actually* reply?
    visual:
      hub:
        tools: [whatsapp, n8n, claude, googlesheets]
        center:
          chat:
            app: whatsapp
            name: Your Business
            status: Business account
            messages:
              - { from: them, text: "Are you open Saturday?", time: "10:24" }
              - { from: me, text: "Yes! 10 AM to 6 PM. Want me to book you in?", time: "10:24" }
              - { from: them, text: "11 AM please", time: "10:25" }
              - { from: me, kind: event, title: "Booked · Sat 11:00 AM", text: "Glow Salon · Haircut", time: "10:25" }
        features:
          - { icon: chat-circle-dots, title: "Answers FAQs", text: "From your own docs" }
          - { icon: funnel, title: "Qualifies leads", text: "Asks the right questions" }
          - { icon: calendar-check, title: "Books slots", text: "Straight into your calendar" }
          - { icon: user-switch, title: "Hands off", text: "To a human when needed" }

  - layout: step
    kicker: Meta Business account
    title: Get a WhatsApp *number*
    body: Use a fresh number. Your personal one can get flagged.
    visual:
      rows:
        - { icon: globe, text: "business.facebook.com → WhatsApp", sub: "Create a Business account" }
        - { icon: phone, text: "Add a new number", sub: "Verify by SMS" }
        - { icon: key, text: "Copy the access token", code: "EAAG…your-token" }

  - layout: step
    kicker: The brain
    title: Tell Claude who it *is*
    body: One prompt with your hours, prices and rules.
    visual:
      claude:
        project: Front desk · WhatsApp
        messages:
          - { from: me, text: "You answer WhatsApp for Glow Salon. Be warm and short. Only use the price list. Book with the calendar tool." }
          - { from: claude, text: "Got it. I'll answer from your price list, keep replies under 3 lines and book slots with the calendar tool." }

  - layout: step
    kicker: The wiring
    title: Connect it with *n8n*
    body: Message in → Claude → reply out. Four nodes.
    visual:
      n8n:
        title: WhatsApp × Claude
        nodes: [whatsapp, { tool: claude, label: "Claude" }, googlecalendar, { tool: whatsapp, label: "Reply" }]

  - layout: step
    kicker: The safety net
    title: Hand off when it's *unsure*
    body: Anything about refunds or complaints goes to you.
    visual:
      notify:
        - { app: whatsapp, title: "Handoff · Priya", text: "Asked about a refund. Your turn.", time: "now" }

  - layout: list
    kicker: Read this twice
    headline: The *honest* limits
    items:
      - { title: "Templates for outbound", text: "You can only start chats with approved templates." }
      - { title: "24-hour window", text: "Free-form replies only within 24h of their last message." }
      - { title: "No spam lists", text: "Message people who contacted you first." }

  - layout: cta
    headline: Want the full workflow file?
    keyword: WORKFLOW
    sub: I'll DM you the n8n file + the prompt.
    doc_title: WhatsApp × Claude setup
