# WORLD PROTOTYPE · The Quest Board (Agent Bro). A prompt pack as a loot drop, each prompt with a rarity.
brand: agentbro-quest
format: F09
title: 5 Prompts to Write Cold Emails That Get Replies
caption: |
  Loot drop: 5 cold-email prompts, from common to legendary.
  Comment PROMPTS and I'll DM you the whole bag.
slides:
  - layout: cover
    style: person
    kicker: Loot drop
    headline: 5 prompts for cold emails that get *replies*
    tagline: Common → legendary
    logos: [claude, gmail]
    stats:
      - { label: Items, value: "5" }
      - { label: Best, value: "Legendary" }

  - layout: prompt
    rarity: legendary
    kicker: The opener
    title: A first line they *can't* ignore
    tool: claude
    prompt: "Read {prospect's LinkedIn post}. Write 3 cold email first lines that reference one specific idea from it. Under 20 words each. No flattery."
    preview:
      gmail:
        - { from: "To: Priya (Head of Growth)", subject: "Your post on churn: the 3rd point stuck with me", tag: "Opened", unread: true }
    tip: strongest item in the bag

  - layout: prompt
    rarity: epic
    kicker: The offer
    title: Features → *one* outcome
    tool: claude
    prompt: "My product: {what it does}. Their role: {job title}. Rewrite my offer as one sentence about a result they get in {timeframe}. No jargon."

  - layout: prompt
    rarity: rare
    kicker: The proof
    title: Proof without *bragging*
    tool: claude
    prompt: "Here is a result I got: {result + client type}. Write one sentence that mentions it as a story, not a boast. Max 25 words."

  - layout: prompt
    rarity: common
    kicker: The ask
    title: End with a *tiny* yes
    tool: claude
    prompt: "Write 5 low-commitment closing questions for a cold email to a {job title}. Each answerable with yes or no."

  - layout: cta
    headline: Want the whole bag?
    keyword: PROMPTS
    sub: I'll DM you all 5 with examples.
    doc_title: Cold email loot bag
