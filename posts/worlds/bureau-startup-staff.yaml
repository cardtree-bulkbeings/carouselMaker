# WORLD PROTOTYPE · The Bureau (Company). "5 AI agents every startup needs" as a staff directory.
brand: company-bureau
format: F03
title: 5 AI Agents Every Startup Needs
series: Staff directory
mascot: assets/agents/cobalt.png
caption: |
  Five new hires. No salaries. Here's who does what at the Bureau.
  Which one would you hire first? Comment the number.
slides:
  - layout: cover
    style: object
    kicker: Staff directory
    headline: 5 AI agents every *startup* needs
    sub: Before your next hire.
    image: assets/agents/grape.png
    color: knowledge
    tag: Now hiring · 5 roles

  - layout: statement
    kicker: Memo
    headline: Five roles. *Zero* salaries.
    visual:
      memo:
        to: Every founder
        from: The Bureau of Doubles
        re: Your next five hires
        date: Monday, 9:00 AM
        body: "Effective today, the inbox, the support desk, meeting prep, follow-ups and the weekly report are covered. Staff profiles follow."
        stamp: Approved
    says: Badges are on the next slides.

  - layout: item
    label: Staff 01
    name: The *inbox* closer
    what: Replies to every lead in under a minute, day or night.
    meta: ["Dept. of Channels", "Night shift"]
    visual:
      badge: { name: "Ivy", role: "Inbox closer", dept: "Channels", no: "#001", photo: assets/agents/cobalt.png, color: channels }

  - layout: item
    label: Staff 02
    name: The *support* desk
    what: Answers the same 30 questions so your team doesn't have to.
    meta: ["Dept. of Knowledge", "24/7"]
    visual:
      badge: { name: "Kit", role: "Support desk", dept: "Knowledge", no: "#002", photo: assets/agents/grape.png, color: knowledge }

  - layout: item
    label: Staff 03
    name: The *meeting* prep
    what: Reads the CRM before every call and briefs you in 3 lines.
    meta: ["Dept. of Voice", "Before every call"]
    visual:
      badge: { name: "Echo", role: "Meeting prep", dept: "Voice", no: "#003", photo: assets/agents/sky.png, color: voice }

  - layout: item
    label: Staff 04
    name: The *follow-up*
    what: Chases every quote you sent and forgot about.
    meta: ["Dept. of Actions", "Day 3 · 7 · 14"]
    visual:
      badge: { name: "Rex", role: "Follow-up", dept: "Actions", no: "#004", photo: assets/agents/tangerine.png, color: actions }
    stamp: Never late

  - layout: recap
    flag: Pin to the noticeboard
    headline: Your 5-agent *startup* staff
    items:
      - { name: "Ivy · inbox closer", tool: gmail, color: channels }
      - { name: "Kit · support desk", tool: whatsapp, color: knowledge }
      - { name: "Echo · meeting prep", tool: googlecalendar, color: voice }
      - { name: "Rex · follow-up", tool: googlesheets, color: actions }
      - { name: "Penny · weekly report", tool: notion, color: personality }

  - layout: cta
    style: question
    kicker: Hiring form
    headline: Which one would you hire *first?*
    answers: ["01", "02", "03", "04", "05"]
    sub: Comment the number. We'll show you how to set it up.
