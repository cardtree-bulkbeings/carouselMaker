      - { name: "Leo", role: "Closer", image: assets/agents/tangerine.png, color: tangerine }
      - { name: "Sam", role: "Follow-up", image: assets/agents/sky.png, color: sky }

  - layout: roster
    role: Prospector
    name: Maya finds the *leads*
    avatar: assets/agents/grape.png
    color: grape
    handles: [ "Scrapes 200 leads a day", "Checks fit against our ICP", "Writes the first line" ]
    tools: [ linkedin, googlesheets ]
    kpi: { value: "200", label: "leads / day" }

  - layout: roster
    role: Closer
    name: Leo books the *calls*
    avatar: assets/agents/tangerine.png
    color: tangerine
    handles: [ "Replies within 60 seconds", "Answers pricing questions", "Books the demo" ]
    tools: [ gmail, googlecalendar ]
    kpi: { value: "60s", label: "reply time" }

  - layout: roster
    role: Follow-up
    name: Sam never *forgets*
    avatar: assets/agents/sky.png
    color: sky
