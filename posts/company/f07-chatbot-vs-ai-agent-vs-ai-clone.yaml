# F07 sample · SAMPLE COPY: replace numbers, names and images before posting.
brand: thedouble-company
format: F07
title: Chatbot vs AI Agent vs AI Clone
series: Know the difference
caption: |
  They're not the same thing. Here's the difference in 6 slides.
  Which one are you using today?
slides:
  - layout: cover
    style: vs
    label: The Double
    label_r: Chatbot · Agent · Clone
    headline: Chatbot vs agent vs clone
    a: { text: "Chatbot *replies*", image: assets/agents/snow.png, color: snow }
    b: { text: "Clone *answers*", image: assets/agents/cobalt.png, color: cobalt }

  - layout: statement
    kicker: In one line each
    headline: Pick the one you *think* you have.
    visual:
      cards:
        - { label: "Chatbot", title: "Follows a script", text: "Buttons and FAQs. Breaks off-script.", image: assets/agents/snow.png, color: snow }
        - { label: "AI agent", title: "Does tasks", text: "Uses tools to get a job done.", image: assets/agents/sky.png, color: sky }
        - { label: "AI clone", title: "Is you", text: "Your knowledge, voice and judgement.", image: assets/agents/cobalt.png, color: lime }

  - layout: versus
    cap: knowledge
    criterion: Round 1 · Off-script questions
    ask: "Can I pay half now and half next month?"
    sides:
      - { label: "Chatbot", avatar: assets/agents/snow.png, text: "“Please choose an option below.”", verdict: bad }
      - { label: "Agent", avatar: assets/agents/sky.png, text: "Checks the policy. Offers a payment plan.", verdict: meh }
      - { label: "Clone", avatar: assets/agents/cobalt.png, text: "“Sure. Pay half today, I'll book your slot now.”", verdict: good, color: cobalt }

  - layout: versus
    cap: personality
    criterion: Round 2 · Memory
    ask: "Hi, it's Riya again. Same as last month?"
    sides:
      - { label: "Chatbot", avatar: assets/agents/snow.png, text: "“Hi! How can I help you today?”", verdict: bad }
      - { label: "Agent", avatar: assets/agents/sky.png, text: "Finds the last order. Asks to confirm.", verdict: meh }
      - { label: "Clone", avatar: assets/agents/cobalt.png, text: "“Hi Riya! Two boxes, Thursday delivery?”", verdict: good, color: cobalt }

  - layout: versus
    cap: voice
    criterion: Round 3 · Sounds like you
    ask: "Wait, am I talking to a bot?"
    sides:
      - { label: "Chatbot", avatar: assets/agents/snow.png, text: "“I am a virtual assistant.”", verdict: bad }
      - { label: "Agent", avatar: assets/agents/sky.png, text: "“I'm an AI assistant. How can I help?”", verdict: meh }
      - { label: "Clone", avatar: assets/agents/cobalt.png, text: "“I'm Sahith's Double. Want him on the call?”", verdict: good, color: cobalt }

  - layout: scorecard
    kicker: Scorecard
    headline: Side by *side*
    cols: ["Chatbot", "Agent", "Clone"]
    winner: 2
    rows:
      - ["Off-script answers", false, "Some", true]
      - ["Remembers people", false, false, true]
      - ["Takes actions", false, true, true]
      - ["Sounds like you", false, false, true]
    verdict: Chatbots answer. Agents act. Clones *represent* you.

  - layout: cta
    style: question
    kicker: Be honest
    headline: Which one is on your website *today?*
    answers: ["Chatbot", "Agent", "Clone", "Nothing yet"]
