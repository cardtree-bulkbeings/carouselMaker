# Agent Bro, the AI-agent guy (not The Double). Main design language: "quest" (docs/WORLDS.md §3, v2).
# Persona 5 labels × Pokémon-card stat blocks × theaiagents density. Quests, loot, XP, achievements.
name: Agent Bro
handle: "@agentbro"
logo: null
emphasis: color
design: quest
skin: brands/agentbro/skin.css
modes: [ light, dark ]       # studio shows a Light / Dark switch
mode: light
lexicon: { step: Quest, item: Slot, prompt: Loot, next: Next objective, next_qa: Next }
fonts:
  - https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=block
  - https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Caveat:wght@700&display=block

tokens:
  # Light is the default. `mode: dark` on a post (or the studio's Light/Dark switch) turns on the lab at night;
  # the dark palette lives in brands/agentbro/skin.css.
  ground: "#FFFFFF"
  paper: "#FFFFFF"
  ink: "#0D0D10"
  muted: "#55555E"
  faint: "#85858E"
  line: "rgba(13,13,16,.12)"
  chip: "#FFE0E3"
  accent: "#E5172F"
  accent-ink: "#FFFFFF"
  accent-deep: "#8F0E1D"
  hi: "#E5172F"
  hi-soft: "#FFE0E3"
  glow: "transparent"
  deep: "#0D0D10"
  deep-ink: "#FFFFFF"
  tray: "#E5172F"
  live: "#22C55E"
  good: "#16A34A"
  bad: "#E5172F"
  note: "#E5172F"
  font-display: "'Satoshi', Arial, sans-serif"
  font-human: "'Satoshi', Arial, sans-serif"
  font-body: "'Inter', system-ui, sans-serif"
  font-mono: "'JetBrains Mono', monospace"
  font-pixel: "'Satoshi', sans-serif"
  font-hand: "'Caveat', cursive"
  display-weight: "900"
  display-track: "-0.05em"
  r-card: "16px"
  r-block: "20px"
  r-tile: "18px"
  shadow: "0 1px 2px rgba(0,0,0,.05), 0 16px 40px -16px rgba(0,0,0,.18), 0 0 0 1px rgba(0,0,0,.05)"

palette:
  red:       ["#E5172F", "#FFE0E3", "#FFFFFF"]
  rare:      ["#2F80ED", "#DCE9FC", "#FFFFFF"]
  epic:      ["#9B51E0", "#EEE1FA", "#FFFFFF"]
  legendary: ["#E8A400", "#FCEFC9", "#0D0D10"]
  ink:       ["#0D0D10", "#E5E5E8", "#FFFFFF"]
  # aliases
  pink:      ["#F0325A", "#FFE3EA", "#FFFFFF"]
  blue:      ["#2F80ED", "#DCE9FC", "#FFFFFF"]
  violet:    ["#7C3AED", "#EDE4FF", "#FFFFFF"]
  orange:    ["#FF7A1A", "#FFE9D9", "#0D0D10"]
  green:     ["#16A34A", "#DCF5E4", "#FFFFFF"]

accents:
  red:    { accent: "#E5172F" }
  blue:   { accent: "#2F80ED" }
  purple: { accent: "#9B51E0" }
  gold:   { accent: "#E8A400", accent_ink: "#0D0D10" }
  green:  { accent: "#12B76A" }

rules:
  cover: person
  mascot: false
