<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Render</title>
<link rel="stylesheet" href="/engine/slides.css">
<link rel="stylesheet" href="/engine/kits.css">
<link rel="stylesheet" href="/engine/worlds.css">
<link rel="stylesheet" href="/engine/chat.css">
<style>
  html, body { margin: 0; background: #222; }
  #slides { display: flex; flex-direction: column; gap: 40px; padding: 40px; width: max-content; }
</style>
</head>
<body>
<div id="slides"></div>
<script type="module">
  import { loadBrand, renderPost, fitText, waitImages, parsePost } from '/engine/engine.js';
  try {
    const path = new URLSearchParams(location.search).get('post');
    const { text } = await (await fetch(`/api/post?path=${encodeURIComponent(path)}`)).json();
    const { post } = parsePost(text);
    const brand = await loadBrand(post.brand);
    const root = document.getElementById('slides');
    root.innerHTML = renderPost(post, brand);
    await waitImages(root);
    await fitText(root);
    window.__ready = true;
  } catch (e) {
    window.__error = e.message;
    console.error(e);
  }
</script>
</body>
</html>
