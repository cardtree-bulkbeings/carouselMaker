id: F07
name: Versus
used_by: [company, agentbro]
use_when: The post compares two or three things head to head.
structure:
  - "1 cover: A vs B (vs C) as a type cover"
  - "2 one-line definitions of each (choose your side)"
  - "3–5 one criterion per slide, each side gets a verdict"
  - "6 scorecard"
  - "7 verdict + question"
rules:
  - Be fair to the losing side. Credibility is the product.
  - Each criterion is something the reader already cares about (speed, memory, cost).
# ---- scaffold ----
brand: thedouble-company
format: F07
title: Chatbot vs AI Agent vs AI Clone
series: Know the difference
caption: |
  They're not the same thing. Here's the difference in 6 slides.
  Which one are you using today?
slides:
  - layout: cover
    style: object
    kicker: Know the difference
    headline: Chatbot vs agent vs *clone*
    sub: They are not the same thing.
    image: assets/agents/cobalt.png
    color: cobalt
    tag: Clone · live

  - layout: statement
    kicker: In one line each
    headline: Pick the one you *think* you have.
    visual:
      cards:
        - { label: "Chatbot", title: "Follows a script", text: "Buttons and FAQs. Breaks off-script.", icon: chat-centered-dots, color: ink }
        - { label: "AI agent", title: "Does tasks", text: "Uses tools to get a job done.", icon: robot, color: cobalt }
        - { label: "AI clone", title: "Is you", text: "Your knowledge, voice and judgement.", icon: user-circle, color: lime }

  - layout: versus
    criterion: Round 1 · Off-script questions
    headline: “Can I pay *half* now?”
    sides:
      - { label: "Chatbot", text: "“Please choose an option below.”", verdict: bad }
      - { label: "Agent", text: "Checks policy, offers a plan.", verdict: meh }
      - { label: "Clone", text: "Answers how *you* would, then books.", verdict: good, color: cobalt }

  - layout: versus
    criterion: Round 2 · Memory
    headline: Remembers last *month?*
    sides:
      - { label: "Chatbot", text: "Every chat starts from zero.", verdict: bad }
      - { label: "Agent", text: "Remembers the task.", verdict: meh }
      - { label: "Clone", text: "Remembers the person.", verdict: good, color: cobalt }

  - layout: versus
    criterion: Round 3 · Sounds like you
    headline: Would a customer *notice?*
    sides:
      - { label: "Chatbot", text: "Instantly.", verdict: bad }
      - { label: "Agent", text: "Probably.", verdict: meh }
      - { label: "Clone", text: "Your tone, your words, your voice.", verdict: good, color: cobalt }

  - layout: scorecard
    kicker: Scorecard
    headline: Side by *side*
    cols: ["Chatbot", "Agent", "Clone"]
    winner: 2
    rows:
      - ["Off-script answers", false, "Some", true]
      - ["Remembers people", false, false, true]
      - ["Takes actions", false, true, true]
      - ["Sounds like you", false, false, true]
    verdict: Chatbots answer. Agents act. Clones *represent* you.

  - layout: cta
    style: question
    kicker: Be honest
    headline: Which one is on your website *today?*
    answers: ["Chatbot", "Agent", "Clone", "Nothing yet"]
